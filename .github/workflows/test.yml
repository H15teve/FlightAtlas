name: Local renderer tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - run: python -m pip install -r plugins/flight-atlas/requirements.txt -r requirements-dev.txt
      - run: npm ci --prefix plugins/flight-atlas --no-audit --no-fund
      - run: python -m pytest tests -q
      - run: python scripts/validate_plugin.py
      - run: python scripts/package_release.py
